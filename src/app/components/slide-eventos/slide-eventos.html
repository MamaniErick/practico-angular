<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/practico-angular/src/app/components/slide-eventos/slide-eventos.css">
</head>
<body>
<div class="slide-container">
    
    <div class="card fachera-card">
        
        <img [src]="eventos[indice].img" class="card-image" alt="Imagen del evento">
        
        <div class="card-content">
            <h3 class="event-title">{{ eventos[indice].nombre }}</h3>
            
            <p class="event-desc text-muted">{{ eventos[indice].descripcion }}</p>

            <div class="controls">
                
                <button (click)="anterior()" class="btn-control anterior" title="Anterior">
                    ‹ </button>
                
                <span class="counter">
                    {{ indice + 1 }} / {{ eventos.length }}
                </span>

                <button (click)="siguiente()" class="btn-control siguiente" title="Siguiente">
                    › </button>
            </div>
        </div>

    </div>

</div>
</body>
</html>
